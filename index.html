<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroceryPrize — Your Promo Code</title>
<style>
  :root{
    --red:#E23744;--red-dark:#C42A36;--blue:#2452A8;--blue-dark:#1B3E85;
    --ink:#1B2430;--muted:#667085;--card:#FFF;--line:#E3E7EF;
  }
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:linear-gradient(165deg,#4FC3E8 0%,#3FB8DE 35%,#4BC7C4 70%,#5AD0BE 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .confetti{position:absolute;display:block;z-index:0;pointer-events:none}.rect{border-radius:3px}.circle{border-radius:50%}
  .card{position:relative;z-index:1;width:100%;max-width:420px;background:#fff;border-radius:20px;padding:36px 28px 28px;box-shadow:0 20px 50px rgba(27,36,48,.18),0 2px 8px rgba(27,36,48,.08);text-align:center}
  .logo{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}.g{color:var(--red)}.p{color:var(--blue)}
  .logo-rule{display:flex;justify-content:center;gap:6px;margin-bottom:26px}.logo-rule span{height:4px;width:46px;border-radius:2px}.r{background:var(--red)}.b{background:var(--blue)}
  h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);font-size:15px;margin:0 0 22px;line-height:1.5}
  .code-box{border:1.5px dashed var(--blue);background:#F5F8FE;border-radius:14px;padding:16px 14px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
  .code-box code{font-family:"SF Mono","Courier New",monospace;font-weight:700;color:var(--blue-dark);font-size:clamp(16px,5.2vw,22px);letter-spacing:1px;white-space:nowrap}
  .copy-btn{width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;color:#fff;background:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .copy-btn:hover{background:var(--red-dark)}.copy-btn:active{transform:scale(.98)}.copy-btn.copied{background:#1E8E5A}
  .copy-btn svg{width:18px;height:18px;flex-shrink:0}
  .details{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:left}
  .details h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}
  .details ul{margin:0;padding-left:18px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<div class="logo"><span class="g">Grocery</span><span class="p">Prize</span></div>
<div class="logo-rule"><span class="r"></span><span class="b"></span></div>
<h1>Your promo code is ready</h1>
<p class="sub">Copy the code below and apply it at checkout on Costco store.</p>
<div class="code-box"><code id="promoCode">Q7KM9XTR4VPL82CW</code></div>
<button class="copy-btn" id="copyBtn" onclick="copyCode()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
<span id="btnLabel">Copy code</span>
</button>
<div class="details">
<h2>How to redeem</h2>
<ul>
<li>Copy the code above</li>
<li>Paste it in the promo code field at Costco checkout</li>
<li>Discount applies automatically if your order qualifies</li>
</ul>
</div>
</div>
<script>
function copyCode(){
 const code=document.getElementById('promoCode').innerText;
 const btn=document.getElementById('copyBtn');
 const label=document.getElementById('btnLabel');
 function showCopied(){label.textContent='Copied!';btn.classList.add('copied');setTimeout(()=>{label.textContent='Copy code';btn.classList.remove('copied');},1800);}
 function fallbackCopy(){const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');showCopied();}catch(e){}document.body.removeChild(t);}
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(code).then(showCopied).catch(fallbackCopy);}else{fallbackCopy();}
}
</script>
</body>
</html>
